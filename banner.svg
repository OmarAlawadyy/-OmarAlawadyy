<svg xmlns="http://www.w3.org/2000/svg" width="800" height="138" viewBox="0 0 800 138" role="img" aria-labelledby="t">
  <title id="t">Hello world. I'm Omar Alawady, Front-End Developer.</title>
  <defs>
    <clipPath id="c1"><rect class="clip1" x="200" y="0" width="0" height="138"/></clipPath>
    <clipPath id="c2"><rect class="clip2" x="170" y="0" width="0" height="138"/></clipPath>
  </defs>
  <style>
    text { font-family: "Courier New", ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }
    .scene1 { opacity: 0; animation: s1 9s linear infinite; }
    .scene2 { opacity: 0; animation: s2 9s linear infinite; }
    .clip1 { animation: type1 9s infinite; }
    .clip2 { animation: type2 9s infinite; }
    .sub { opacity: 0; animation: sub 9s linear infinite; }
    .slash { stroke: #ffc93c; stroke-width: 3; stroke-linecap: round; }
    @keyframes s1 { 0%,2% {opacity:0} 4%,34% {opacity:1} 38%,100% {opacity:0} }
    @keyframes s2 { 0%,40% {opacity:0} 43%,94% {opacity:1} 98%,100% {opacity:0} }
    @keyframes type1 { 0%,4% {width:0; animation-timing-function:steps(14,end)} 22%,100% {width:400} }
    @keyframes type2 { 0%,43% {width:0; animation-timing-function:steps(16,end)} 62%,100% {width:460} }
    @keyframes sub { 0%,64% {opacity:0} 70%,94% {opacity:1} 98%,100% {opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .scene1 { display: none; }
      .scene2, .sub { animation: none; opacity: 1; }
      .clip2 { animation: none; width: 460px; }
    }
  </style>

  <rect width="800" height="138" rx="12" fill="#0f1526"/>
  <line class="slash" x1="10" y1="42" x2="42" y2="10"/>
  <line class="slash" x1="758" y1="128" x2="790" y2="96"/>

  <g class="scene1" clip-path="url(#c1)">
    <text x="215" y="82" font-size="44" fill="#eef1fa" textLength="370" lengthAdjust="spacingAndGlyphs">Hello <tspan fill="#ffc93c">&lt;world/&gt;</tspan></text>
  </g>

  <g class="scene2">
    <g clip-path="url(#c2)">
      <text x="189" y="70" font-size="44" fill="#eef1fa" textLength="422" lengthAdjust="spacingAndGlyphs">I'm <tspan fill="#8aa2ff">Omar Alawady</tspan></text>
    </g>
    <text class="sub" x="165" y="106" font-size="18" fill="#a3adc7" textLength="470" lengthAdjust="spacingAndGlyphs">Front-End Developer | HTML · CSS · JavaScript</text>
  </g>
</svg>
